server {
    listen 80;
    server_name sangwoo.top www.sangwoo.top;

    root /usr/share/nginx/html;
    index index.html;

    # Root redirect to zh
    location = / {
        return 302 /zh/;
    }

    # SSG routes - try_files handles trailing slash redirect automatically
    location / {
        try_files $uri $uri/ =404;
    }

    # 404 fallback - serve zh index for unknown routes
    error_page 404 /zh/index.html;
    location = /404.html {
        internal;
        alias /usr/share/nginx/html/zh/index.html;
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin interface
    location /admin {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dashboard
    location /dashboard {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://fastapi:8000;
    }

    # Uploaded files
    location /uploads/ {
        alias /data/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
