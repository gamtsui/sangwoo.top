# Security: rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/m;

# Security: connection limiting
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# HTTP server - redirect to HTTPS
server {
    listen 80;
    server_name sangwoo.top www.sangwoo.top;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://sangwoo.top$request_uri;
    }
}

# HTTPS server - primary (non-www)
server {
    listen 443 ssl http2;
    server_name sangwoo.top;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/sangwoo.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sangwoo.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security: hide Nginx version
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Security: connection limiting
    limit_conn conn_limit 20;

    # Astro static assets - long cache
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Uploaded files
    location /uploads/ {
        alias /data/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    # Favicon
    location = /favicon.ico {
        expires 30d;
    }
    location = /favicon.svg {
        expires 30d;
    }

    # Health check (no rate limit)
    location /health {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API reverse proxy (rate limited)
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin interface (strict rate limiting)
    location /admin {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dashboard (rate limited)
    location /dashboard {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Webhook (auto-translation, rate limited)
    location /webhook/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static pages - moderate cache + security headers + root redirect
    # NOTE: add_header in location BLOCKS server-level add_header, so we repeat all security headers here
    location / {
        # Redirect bare root → /zh/ (Astro uses [locale] routing, no root index.html)
        if ($uri = /) {
            return 302 /zh/;
        }
        try_files $uri $uri/ =404;
        expires 1h;
        add_header Cache-Control "public, no-transform" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}

# HTTPS server - www → non-www redirect
server {
    listen 443 ssl http2;
    server_name www.sangwoo.top;

    ssl_certificate /etc/letsencrypt/live/sangwoo.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sangwoo.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://sangwoo.top$request_uri;
}
