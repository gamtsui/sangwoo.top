services:
  - type: web
    name: sangwoo-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    rootDir: .
    envVars:
      - key: DATABASE_URL
        value: "sqlite:////data/app.db"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: "https://sangwoo.top"
      - key: PORT
        value: "10000"
    disk:
      name: db-data
      mountPath: /data
    healthCheckPath: /health
