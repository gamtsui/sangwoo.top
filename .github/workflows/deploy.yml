name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build Astro
      working-directory: ./frontend
      run: npm run build
      env:
        API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://sangwoo.top/api' }}

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Stop current containers
          cd /opt/sangwoo
          docker-compose down || true
          
          # Sync frontend dist
          mkdir -p /opt/sangwoo/frontend/dist
          rm -rf /opt/sangwoo/frontend/dist/*
          
          # Sync backend code
          rm -rf /opt/sangwoo/backend/app/*
          
          # Sync nginx config
          rm -f /opt/sangwoo/nginx/sangwoo.top.conf
          
          # Sync scripts
          rm -rf /opt/sangwoo/scripts/*
          
          # Restart containers
          docker-compose up -d
          
          # Wait for health check
          sleep 5
          curl -f http://localhost/health || echo "Health check failed"
          
          # Reload nginx
          sudo nginx -t && sudo systemctl reload nginx || true

    - name: Notify on failure
      if: failure()
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "Deployment failed at $(date)" >> /opt/sangwoo/deploy-log.txt
          docker-compose logs --tail=50 >> /opt/sangwoo/deploy-log.txt
