<!DOCTYPE html>
<html lang="{{ locale }}" class="bg-gray-900 text-gray-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ _('site_title') }}{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.0"></script>
  <style>
    body { font-family: 'Inter', 'Noto Sans SC', sans-serif; }
    .card { @apply bg-gray-800 rounded-lg p-4 border border-gray-700; }
    .btn { @apply px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white transition; }
    .btn-sm { @apply px-3 py-1 text-sm rounded bg-blue-600 hover:bg-blue-700 text-white transition; }
    .btn-danger { @apply px-3 py-1 text-sm rounded bg-red-600 hover:bg-red-700 text-white transition; }
    .btn-success { @apply px-3 py-1 text-sm rounded bg-green-600 hover:bg-green-700 text-white transition; }
    input, select { @apply bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white; }
    table { @apply w-full text-sm; }
    th { @apply text-left py-2 px-3 border-b border-gray-700 text-gray-400; }
    td { @apply py-2 px-3 border-b border-gray-800; }
  </style>
</head>
<body class="min-h-screen">
  <div class="max-w-7xl mx-auto p-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">{{ _('site_title') }}</h1>
      <div class="flex items-center gap-4">
        <a href="/admin/dashboard/lang?lang=en&redirect={{ redirect_uri }}" class="text-sm {% if locale=='en' %}text-blue-400{% else %}text-gray-400 hover:text-white{% endif %}">EN</a>
        <a href="/admin/dashboard/lang?lang=zh&redirect={{ redirect_uri }}" class="text-sm {% if locale=='zh' %}text-blue-400{% else %}text-gray-400 hover:text-white{% endif %}">中文</a>
        <span class="text-gray-400 text-sm">{{ username }}</span>
        <form action="/api/admin/logout" method="post" class="inline">
          <button type="submit" class="text-sm text-red-400 hover:text-red-300">{{ _('logout') }}</button>
        </form>
      </div>
    </div>
    {% from 'dashboard/nav.html' import nav %}
    {{ nav(active, _) }}
    {% block content %}{% endblock %}
  </div>

  <script>
    // Session timeout polling
    (function() {
      setInterval(function() {
        fetch('/api/admin/session/check')
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data.status === 'expired') {
              window.location.href = '/admin/dashboard/login';
              return;
            }
            if (data.status === 'expiring') {
              if (!window.__sessionWarningShown) {
                window.__sessionWarningShown = true;
                alert(data.message || 'Session expiring soon. Please save your work.');
                setTimeout(function() { window.__sessionWarningShown = false; }, 30000);
              }
            }
          })
          .catch(function() {});
      }, 30000);
    })();
  </script>
</body>
</html>
