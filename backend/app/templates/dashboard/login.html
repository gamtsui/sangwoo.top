<!DOCTYPE html>
<html lang="{{ locale }}" class="bg-gray-900 text-gray-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ _('login') }} - Sangwoo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', 'Noto Sans SC', sans-serif; }
    .card { @apply bg-gray-800 rounded-lg p-4 border border-gray-700; }
    .btn { @apply px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white transition; }
    input { @apply bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center">
  <div class="card w-full max-w-md">
    <h2 class="text-xl font-bold mb-6 text-center">{{ _('site_title') }}</h2>
    {% if error %}
    <div class="bg-red-900/50 border border-red-700 text-red-200 rounded p-3 mb-4 text-sm">{{ error }}</div>
    {% endif %}
    <form method="post" action="/admin/dashboard/login" class="space-y-4">
      <div>
        <label class="block text-sm text-gray-400 mb-1">{{ _('username') }}</label>
        <input type="text" name="username" class="w-full" autofocus value="{{ username or '' }}" required>
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1">{{ _('password') }}</label>
        <input type="password" name="password" class="w-full" required>
      </div>
      <button type="submit" class="btn w-full">{{ _('login') }}</button>
    </form>
    <div class="mt-4 text-center">
      <a href="/admin/dashboard/lang?lang=en" class="text-sm {% if locale=='en' %}text-blue-400{% else %}text-gray-400 hover:text-white{% endif %}">EN</a>
      <span class="text-gray-600 mx-2">|</span>
      <a href="/admin/dashboard/lang?lang=zh" class="text-sm {% if locale=='zh' %}text-blue-400{% else %}text-gray-400 hover:text-white{% endif %}">中文</a>
    </div>
  </div>
</body>
</html>
